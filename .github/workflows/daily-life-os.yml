name: Daily Life OS Update

on:
  schedule:
    - cron: '0 0 * * *' # 07:00 AM UTC+7 (00:00 UTC)
  workflow_dispatch: # Allow manual run

permissions:
  contents: write

jobs:
  update-life-os:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Life OS script
        env:
          TYPHOON_API_KEY: ${{ secrets.TYPHOON_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python life_os.py

      - name: Commit and push changes
        run: |
          git config --global user.name "PhakapholDherachaisuphakij"
          git config --global user.email "pkdhera9@gmail.com"
          git add Priority_Daily.md daily_data.json
          git commit -m "chore: update daily life os strategy [skip ci]" || echo "No changes to commit"
          git push
